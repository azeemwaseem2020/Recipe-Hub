<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RecipeHub | اردو ترکیب</title><meta name="description" content="RecipeHub کی مکمل اردو ترکیب، اجزاء اور مرحلہ وار طریقہ۔"><link rel="canonical" href="https://azeemwaseem2020.github.io/Recipe-Hub/ur/recipe.html"><style>body{margin:0;background:#fbfaf6;color:#18251f;font:16px/1.8 system-ui,-apple-system,Segoe UI,Arial,sans-serif}.wrap{width:min(850px,92%);margin:auto}.top{background:#073f2f;color:#fff;padding:9px 0}.top a{color:#073f2f;background:#fff;padding:4px 12px;border-radius:99px;text-decoration:none;font-weight:800}.hero{background:#073f2f;color:#fff;padding:45px 0}.hero h1{font:900 42px/1.2 Georgia,serif;margin:0}.photo{height:330px;background-size:cover;background-position:center;margin:28px 0;border-radius:16px}.box{background:#fff;border:1px solid #e4e9e5;border-radius:14px;padding:22px;margin:18px 0}.box h2{color:#073f2f;font:800 25px Georgia,serif}.back{display:inline-block;background:#073f2f;color:#fff;padding:10px 16px;border-radius:9px;text-decoration:none;font-weight:800}@media(max-width:600px){.photo{height:230px}.hero h1{font-size:34px}}</style></head><body><div class="top"><div class="wrap"><a href="./">← تمام تراکیب</a> <a href="../">English</a></div></div><section class="hero"><div class="wrap"><h1 id="title">ترکیب</h1><p id="intro"></p></div></section><main class="wrap"><div class="photo" id="photo"></div><div class="box"><h2>اجزاء</h2><ul id="ingredients"></ul></div><div class="box"><h2>بنانے کا طریقہ</h2><ol id="steps"></ol></div><a class="back" href="./">← اردو تراکیب پر واپس جائیں</a></main><script>const D={biryani:{t:'چکن بریانی',i:'چاول، چکن اور خوشبودار مصالحوں سے تیار ہونے والی مزیدار پاکستانی بریانی۔',p:'https://images.deliveryhero.io/image/fd-pk/Products/76523368.jpg?width=900',a:['چکن','باسمتی چاول','دہی','ٹماٹر','پیاز','ادرک لہسن','بریانی مصالحہ','نمک اور تیل'],s:['چاول دھو کر مناسب مقدار میں پانی اور نمک کے ساتھ ابالیں اور آدھے گلنے پر نکال لیں۔','چکن کو پیاز، ادرک لہسن، ٹماٹر، دہی اور مصالحوں کے ساتھ بھونیں۔','چکن گلنے کے بعد تہہ میں چکن اور اوپر چاول رکھیں۔','دم پر تقریباً 15 سے 20 منٹ پکائیں اور پھر ہلکے ہاتھ سے مکس کر کے گرم پیش کریں۔']},'karahi-gosht':{t:'کڑاہی گوشت',i:'ٹماٹر، گوشت اور ہری مرچ سے تیار ہونے والی روایتی کڑاہی۔',p:'https://images.deliveryhero.io/image/global-menu-service/FP_PK/vendor/u3wr/product/41eb2355-1435-4e2a-a63a-242e20312a12.jpg?width=900',a:['گوشت','ٹماٹر','ادرک','ہری مرچ','لہسن','لال مرچ','نمک','تیل'],s:['گوشت کو تیل میں اچھی طرح بھونیں۔','ٹماٹر اور لہسن شامل کر کے ڈھک دیں تاکہ گوشت نرم ہو جائے۔','نمک اور لال مرچ ڈال کر بھونیں یہاں تک کہ تیل الگ ہو جائے۔','ادرک اور ہری مرچ ڈال کر چند منٹ دم دیں اور گرم پیش کریں۔']},'chicken-tikka':{t:'چکن تکہ',i:'دہی اور خوشبودار مصالحوں میں میرینیٹ کیا ہوا رسیلا چکن تکہ۔',p:'https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?auto=format&fit=crop&w=1400&q=85',a:['چکن','دہی','لیموں کا رس','ادرک لہسن','تکہ مصالحہ','نمک','تیل'],s:['تمام میرینیڈ اجزاء ملا کر چکن کو اچھی طرح کوٹ کریں۔','کم از کم 2 گھنٹے میرینیٹ کریں۔','گرل، اوون یا ایئر فرائر میں چکن کو مکمل پکنے تک تیار کریں۔','لیموں اور سلاد کے ساتھ گرم پیش کریں۔']}};const key=new URLSearchParams(location.search).get('r')||'biryani',d=D[key]||D.biryani;title.textContent=d.t;intro.textContent=d.i;photo.style.backgroundImage=`url('${d.p}')`;ingredients.innerHTML=d.a.map(x=>`<li>${x}</li>`).join('');steps.innerHTML=d.s.map(x=>`<li>${x}</li>`).join('');</script></body></html>
