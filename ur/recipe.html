'chicken-tikka':{t:'چکن تکہ',i:'دہی، لیموں اور مصالحوں میں میرینیٹ کیا ہوا رسیلا چکن، جسے گرل یا اوون میں تیز حرارت سے پکایا جاتا ہے۔',p:'https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?auto=format&fit=crop&w=1400&q=85',time:'تیاری 20 منٹ • میرینیٹ 2–8 گھنٹے • پکانا 20–25 منٹ',a:['700 گرام چکن','1 کپ گاڑھا دہی','1 کھانے کا چمچ لیموں','1 کھانے کا چمچ ادرک لہسن','1.5 کھانے کے چمچ تکہ مصالحہ','آدھا چائے کا چمچ لال مرچ','نمک','1 کھانے کا چمچ تیل'],s:['چکن کے موٹے ٹکڑوں پر ہلکے کٹ لگائیں تاکہ میرینیڈ اندر تک پہنچے۔','دہی، لیموں، ادرک لہسن، تکہ مصالحہ، نمک، مرچ اور تیل ملا کر گاڑھا میرینیڈ بنائیں۔','چکن کو اچھی طرح کوٹ کر کم از کم دو گھنٹے فریج میں رکھیں۔','پکانے سے 15 منٹ پہلے چکن باہر نکالیں۔','اوون کو 220°C پر گرم کریں یا گرل کو اچھی طرح پری ہیٹ کریں۔','چکن کو ایک تہہ میں رکھیں اور 10 سے 12 منٹ بعد پلٹیں۔','آخر میں مختصر تیز گرل سے کناروں پر رنگ دیں مگر چکن خشک نہ کریں۔','پانچ منٹ آرام دے کر لیموں، پیاز اور ہری چٹنی کے ساتھ پیش کریں۔'],idea:'گاڑھا دہی اور آخر میں تیز گرل اندر سے نرمی اور باہر سے ہلکا دھواں دار رنگ دیتی ہے۔',serve:'کچومر، پودینے کی چٹنی، لیموں اور گرم نان کے ساتھ پیش کریں۔',tips:['چکن خشک ہو تو اگلی بار کم وقت پکائیں۔','ذائقہ ہلکا ہو تو میرینیڈ میں نمک اور مصالحہ پہلے درست کریں۔','میرینیڈ پتلا ہو تو گاڑھا دہی استعمال کریں۔']},
'gulab-jamun':{t:'گلاب جامن',i:'نرم گلاب جامن جو ہلکے گرم خوشبودار شیرے میں اچھی طرح جذب ہوتے ہیں۔',p:'https://images.unsplash.com/photo-1593701461250-d7b22dfd3a77?auto=format&fit=crop&w=1400&q=85',time:'تیاری 20 منٹ • پکانا 25 منٹ • شیرے میں 1–2 گھنٹے',a:['1 کپ ملک پاؤڈر','2 کھانے کے چمچ میدہ','آدھا چائے کا چمچ بیکنگ پاؤڈر','دودھ حسبِ ضرورت','1.5 کپ چینی','2 کپ پانی','2 الائچی','گھی یا تیل'],s:['چینی، پانی اور الائچی کو 5 سے 7 منٹ پکائیں؛ شیرہ بہت گاڑھا نہ کریں۔','ملک پاؤڈر، میدہ اور بیکنگ پاؤڈر ملا کر تھوڑا تھوڑا دودھ ڈالیں اور نرم آٹا بنائیں۔','آٹے کو زیادہ نہ گوندھیں اور ہموار چھوٹی گیندیں بنائیں۔','گھی یا تیل درمیانی سے ہلکی آنچ پر گرم کریں؛ بہت تیز تیل سے باہر جل سکتا ہے۔','گیندیں آہستہ آہستہ یکساں سنہری ہونے تک تلیں۔','سنہری گلاب جامن کو نیم گرم شیرے میں منتقل کریں۔','کم از کم ایک سے دو گھنٹے شیرے میں رہنے دیں تاکہ اندر تک جذب ہو۔','پستہ یا بادام کے ساتھ گرم یا نیم گرم پیش کریں۔'],idea:'چھوٹی اور بالکل ہموار گیندیں تلنے اور شیرہ جذب کرنے میں یکسانیت دیتی ہیں۔',serve:'الائچی والے شیرے کے ساتھ گرم یا نیم گرم پیش کریں۔',tips:['گلاب جامن پھٹیں تو آٹے میں دراڑیں ختم کریں۔','اندر کچے ہوں تو تیل بہت تیز تھا۔','شیرہ جذب نہ ہو تو اسے بہت گاڑھا نہ رکھیں۔']},
'chana-masala':{t:'چنا مصالحہ',i:'نرم چنے، ٹماٹر اور بھنے مصالحوں سے تیار ہونے والی گاڑھی اور خوشبودار چنا مصالحہ ڈش۔',p:'https://indianhealthyrecipe.com/wp-content/uploads/2024/01/2023_01_25_creamy_chana_masala_1.jpg',time:'تیاری 15 منٹ • پکانا 35 منٹ',a:['3 کپ ابلے چنے','1 بڑی پیاز','2 ٹماٹر','1 کھانے کا چمچ ادرک لہسن','1.5 چائے کے چمچ چنا مصالحہ','آدھا چائے کا چمچ زیرہ','آدھا چائے کا چمچ لال مرچ','نمک','2 کھانے کے چمچ تیل'],s:['تیل میں زیرہ اور پیاز ڈال کر پیاز سنہری کریں۔','ادرک لہسن اور ٹماٹر شامل کر کے ٹماٹر مکمل نرم ہونے تک بھونیں۔','چنا مصالحہ، مرچ اور نمک ڈال کر ایک سے دو منٹ بھونیں۔','ابلے چنے شامل کریں اور اچھی طرح مکس کریں۔','آدھا کپ چنے کا محفوظ پانی تھوڑا تھوڑا شامل کریں۔','10 سے 15 منٹ ہلکی آنچ پر پکائیں۔','چند چنے چمچ سے کچل دیں تاکہ گریوی قدرتی طور پر گاڑھی ہو۔','دھنیا، ہری مرچ اور لیموں کے ساتھ پیش کریں۔'],idea:'چند چنوں کو کچلنے سے بغیر آٹے یا کارن فلور کے قدرتی گاڑھی گریوی بنتی ہے۔',serve:'پوری، بھٹورے، نان یا چاول کے ساتھ پیش کریں۔',tips:['گریوی پتلی ہو تو کچھ چنے کچل کر کھلا پکائیں۔','چنے سخت ہوں تو پہلے انہیں مکمل نرم ابالیں۔','نمک زیادہ ہو تو بغیر نمک چنے شامل کر کے مقدار بڑھائیں۔']},
'seek-kebab':{t:'سیخ کباب',i:'مصالحہ دار قیمے سے بنے رسیلے پاکستانی سیخ کباب جن میں گوشت کا ذائقہ نمایاں رہتا ہے۔',p:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Seekh%20Kabab%202.JPG',time:'تیاری 25 منٹ • آرام 30 منٹ • پکانا 15–20 منٹ',a:['500 گرام بیف یا مٹن قیمہ','1 چھوٹی پیاز باریک کٹی اور نچوڑی ہوئی','2 ہری مرچیں','2 کھانے کے چمچ ہرا دھنیا','1 چائے کا چمچ زیرہ','1 چائے کا چمچ دھنیا پاؤڈر','آدھا چائے کا چمچ لال مرچ','نمک','1 کھانے کا چمچ بیسن'],s:['پیاز کا اضافی پانی اچھی طرح نچوڑیں تاکہ آمیزہ گیلا نہ ہو۔','قیمہ، پیاز، مرچ، دھنیا، مصالحے، نمک اور بیسن ملائیں۔','آمیزے کو 5 سے 7 منٹ اچھی طرح گوندھیں تاکہ کباب سیخ پر قائم رہیں۔','30 منٹ فریج میں رکھیں۔','گیلے ہاتھ سے سیخ کے گرد یکساں موٹائی میں قیمہ لگائیں۔','گرل یا پین کو اچھی طرح گرم کریں اور شروع میں کباب نہ چھیڑیں۔','پلٹ کر دوسری طرف پکائیں اور ضرورت ہو تو ہلکا تیل لگائیں۔','دو منٹ آرام دے کر چٹنی، پیاز اور لیموں کے ساتھ پیش کریں۔'],idea:'پیاز کا پانی نچوڑنا اور قیمے کو اچھی طرح گوندھنا کباب کو سیخ سے ٹوٹنے سے بچاتا ہے۔',serve:'پودینے کی چٹنی، کچی پیاز، لیموں اور نان کے ساتھ پیش کریں۔',tips:['کباب سیخ سے اتر رہے ہوں تو آمیزہ گیلا ہے؛ تھوڑا بیسن شامل کریں۔','کباب خشک ہوں تو زیادہ پکانے سے بچیں۔','اندر کچا ہو تو موٹائی کم اور آنچ درمیانی رکھیں۔']},
'daal-makhani':{t:'دال مکھنی',i:'کالی دال اور راجما کو آہستہ پکا کر مکھن اور کریمی ساخت کے ساتھ تیار کرنے والی بھرپور ڈش۔',p:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Dal%20Makhani.jpg',time:'بھگونا 8 گھنٹے • پکانا 90–120 منٹ',a:['1 کپ ثابت کالی دال','¼ کپ راجما','1 پیاز','2 ٹماٹر','1 کھانے کا چمچ ادرک لہسن','2 کھانے کے چمچ مکھن','½ کپ کریم','1 چائے کا چمچ لال مرچ','نمک'],s:['کالی دال اور راجما رات بھر بھگو کر دھوئیں۔','نرم ہونے تک ابالیں؛ دانہ انگلی سے آسانی سے دب جائے تو مناسب ہے۔','پیاز کو مکھن میں ہلکا سنہری کر کے ادرک لہسن شامل کریں۔','ٹماٹر اور مرچ ڈال کر مصالحہ گاڑھا ہونے تک پکائیں۔','دال اور راجما کو کچھ پانی کے ساتھ شامل کریں۔','ہلکی آنچ پر 30 سے 40 منٹ پکائیں اور کبھی کبھار ہلائیں۔','چند دانے ہلکے کچل دیں تاکہ قدرتی کریمی ساخت بنے۔','آخر میں کریم اور تھوڑا مکھن ڈال کر نمک درست کریں اور نان کے ساتھ پیش کریں۔'],idea:'دال مکھنی کو جلدی گاڑھا کرنے کے بجائے آہستہ پکانا اس کی گہری کریمی ساخت بناتا ہے۔',serve:'بٹر نان، تندوری روٹی یا جیرا رائس کے ساتھ پیش کریں۔',tips:['دال سخت ہو تو مزید پانی کے ساتھ پکاتے رہیں۔','بہت گاڑھی ہو تو گرم پانی دیں۔','کریم پھٹنے سے بچانے کے لیے آخر میں کم آنچ رکھیں۔']},
'chicken-pulao':{t:'چکن پلاؤ',i:'ہلکے مصالحوں، خوشبودار باسمتی چاول اور نرم چکن سے تیار ہونے والا خوش ذائقہ پاکستانی پلاؤ۔',p:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Chicken%20Pulao.jpg',time:'تیاری 20 منٹ • پکانا 50 منٹ • دم 15 منٹ',a:['500 گرام چکن','2 کپ باسمتی چاول','1 پیاز','1 چائے کا چمچ زیرہ','2 دارچینی کے ٹکڑے','4 الائچی','4 لونگ','1 کھانے کا چمچ ادرک لہسن','نمک','2 کھانے کے چمچ تیل'],s:['چاول دھو کر 20 منٹ بھگو دیں۔','تیل میں زیرہ، دارچینی، الائچی اور لونگ خوشبودار کریں۔','پیاز سنہری کر کے ادرک لہسن اور چکن شامل کریں۔','چکن کو چند منٹ بھونیں۔','پانی اور نمک ڈال کر چکن تقریباً گلنے تک پکائیں اور یخنی کا نمک درست کریں۔','چاول شامل کریں اور پانی مناسب رکھیں تاکہ چاول نرم ہوں مگر اضافی پانی نہ بچے۔','پانی تقریباً خشک ہو جائے تو بہت ہلکی آنچ پر 12 سے 15 منٹ دم دیں۔','پانچ منٹ آرام دے کر چاول پھلائیں اور رائتہ کے ساتھ پیش کریں۔'],idea:'پلاؤ میں مصالحے کم مگر خوشبودار رکھیں؛ چاول کا اصل ذائقہ صاف یخنی سے بنتا ہے۔',serve:'رائتہ، سلاد، لیموں اور اچار کے ساتھ پیش کریں۔',tips:['چاول گیلے ہوں تو اگلی بار پانی کم کریں۔','نمک کم ہو تو یخنی کے مرحلے پر درست کریں۔']},
'butter-naan':{t:'بٹر نان',i:'نرم، ہلکا پھولا ہوا نان جس پر آخر میں مکھن لگانے سے خوشبودار فنش ملتا ہے۔',p:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Naan.jpg',time:'تیاری 20 منٹ • آرام 60 منٹ • پکانا 15 منٹ',a:['3 کپ میدہ','1 چائے کا چمچ خمیر','1 چائے کا چمچ چینی','½ کپ دہی','1 کھانے کا چمچ تیل','نیم گرم پانی حسبِ ضرورت','نمک','مکھن'],s:['میدہ، خمیر، چینی اور نمک ملائیں، پھر دہی اور تیل شامل کریں۔','نیم گرم پانی سے نرم آٹا بنائیں۔ بہت سخت آٹا نان کو بھاری کر دے گا۔','آٹے کو ڈھک کر تقریباً ایک گھنٹہ پھولنے دیں۔','برابر حصے کر کے بیضوی شکل میں پھیلائیں اور سطح پر ہلکا پانی لگائیں۔','بہت گرم توا یا اوون میں نان کو بلبلے بننے اور کنارے سنہری ہونے تک پکائیں۔','اوون میں ہوں تو آخر میں مختصر تیز حرارت سے رنگ دیں۔','گرم نان پر فوراً مکھن لگائیں۔','کپڑے میں ڈھانپ کر نرم رکھیں اور گرم سالن کے ساتھ پیش کریں۔'],idea:'نرم آٹا اور پکنے کے فوراً بعد مکھن لگانا بٹر نان کی بہترین ساخت دیتا ہے۔',serve:'کڑاہی، بٹر چکن، دال مکھنی یا نہاری کے ساتھ گرم پیش کریں۔',tips:['نان سخت ہو تو آٹا خشک یا حرارت کم ہو سکتی ہے۔','توا سے نہ چپکے تو نان کی سطح پر پانی یا توا کی حرارت چیک کریں۔']},
'aloo-gobi':{t:'آلو گوبی',i:'آلو اور پھول گوبھی کو ہلکے مصالحوں کے ساتھ بھون کر تیار ہونے والی خوشبودار سبزی۔',p:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Aloo_Gobi.jpg',time:'تیاری 15 منٹ • پکانا 30 منٹ',a:['3 آلو','1 درمیانی پھول گوبھی','1 پیاز','2 ٹماٹر','1 چائے کا چمچ زیرہ','آدھا چائے کا چمچ ہلدی','1 چائے کا چمچ دھنیا پاؤڈر','نمک','2 کھانے کے چمچ تیل'],s:['گوبھی کو یکساں پھولوں میں کاٹ کر دھوئیں اور اچھی طرح خشک کریں۔','تیل گرم کر کے زیرہ اور آلو شامل کر کے چند منٹ بھونیں۔','پیاز اور مصالحے شامل کریں اور پیاز نرم ہونے دیں۔','گوبھی ڈال کر تیز آنچ پر چند منٹ بھونیں۔','ٹماٹر، نمک اور باقی مصالحے شامل کریں۔','ڈھک کر درمیانی سے ہلکی آنچ پر پکائیں اور درمیان میں آہستہ پلٹیں۔','بہت خشک لگے تو صرف ایک دو چمچ پانی دیں؛ زیادہ پانی سبزی گلا دے گا۔','آلو نرم اور گوبھی پکی مگر اپنی شکل میں ہو تو دھنیا ڈال کر پیش کریں۔'],idea:'گوبھی کو پہلے خشک حالت میں بھوننے سے ذائقہ گہرا اور سبزی کم پانی والی رہتی ہے۔',serve:'روٹی، نان یا دال کے ساتھ پیش کریں۔',tips:['سبزی گل جائے تو پانی زیادہ تھا۔','آلو کچے ہوں تو ٹکڑے یکساں رکھ کر ڈھک کر مزید وقت دیں۔']},
'rajma-masala':{t:'راجما مصالحہ',i:'نرم سرخ لوبیا، ٹماٹر اور بھنے مصالحوں سے تیار ہونے والی گاڑھی بھارتی طرز کی گریوی۔',p:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Rajma.jpg',time:'بھگونا 8 گھنٹے • پکانا 60–90 منٹ',a:['2 کپ راجما','1 بڑی پیاز','2 ٹماٹر','1 کھانے کا چمچ ادرک لہسن','1 چائے کا چمچ زیرہ','1 چائے کا چمچ دھنیا پاؤڈر','آدھا چائے کا چمچ لال مرچ','آدھا چائے کا چمچ گرم مصالحہ','نمک','2 کھانے کے چمچ تیل'],s:['راجما رات بھر بھگو کر تازہ پانی میں نرم ہونے تک ابالیں۔','تیل میں زیرہ اور پیاز ڈال کر سنہری کریں۔','ادرک لہسن اور ٹماٹر شامل کر کے اچھی طرح بھونیں۔','دھنیا، مرچ، گرم مصالحہ اور نمک ڈالیں۔','ابلے راجما اور کچھ یخنی شامل کریں۔','20 سے 30 منٹ ہلکی آنچ پر پکائیں تاکہ ذائقے مل جائیں۔','چند راجما کچلیں تاکہ گریوی قدرتی طور پر گاڑھی ہو۔','چاول، دھنیا اور لیموں کے ساتھ پیش کریں۔'],idea:'راجما کو گریوی میں مناسب وقت ہلکی آنچ پر پکانا اسے مصالحوں کا ذائقہ جذب کرنے دیتا ہے۔',serve:'سادہ یا جیرا رائس، پیاز اور لیموں کے ساتھ پیش کریں۔',tips:['راجما سخت ہو تو پہلے مکمل نرم ابالیں۔','گریوی پتلی ہو تو کچھ راجما کچل کر کھلا پکائیں۔','ذائقہ پھیکا ہو تو نمک اور آخر میں تھوڑا لیموں شامل کریں۔']},
'kheer':{t:'کھیر',i:'دودھ، چاول اور الائچی سے تیار ہونے والی روایتی میٹھی کھیر جس میں آہستہ پکانے سے قدرتی کریمی پن آتا ہے۔',p:'https://upload.wikimedia.org/wikipedia/commons/6/6d/Kheer_Special.JPG',time:'تیاری 10 منٹ • پکانا 60–75 منٹ',a:['1 لیٹر دودھ','¼ کپ چاول','½ کپ چینی','3 الائچی','2 کھانے کے چمچ بادام یا پستہ','1 کھانے کا چمچ کشمش، اختیاری'],s:['چاول دھو کر 20 منٹ بھگوئیں اور ہلکا سا کچل لیں۔','بھاری برتن میں دودھ ابال کر آنچ ہلکی کریں۔','چاول شامل کر کے وقفے وقفے سے ہلاتے رہیں تاکہ نیچے نہ لگیں۔','دودھ کو آہستہ کم ہونے دیں؛ تیز آنچ سے جلنے کا خطرہ بڑھتا ہے۔','الائچی شامل کر کے چاول مکمل نرم اور دودھ گاڑھا ہونے تک پکائیں۔','چاول تقریباً گل جائیں تو چینی ڈالیں اور مزید 10 سے 15 منٹ پکائیں۔','چولہا بند کرنے سے پہلے ساخت قدرے پتلی رکھیں کیونکہ ٹھنڈا ہونے پر کھیر مزید گاڑھی ہو گی۔','بادام، پستہ اور کشمش سے سجا کر پیش کریں۔'],idea:'چینی آخر میں ڈالنے سے چاول آسانی سے نرم ہوتے ہیں اور کھیر غیر ضروری طور پر بہت گاڑھی نہیں بنتی۔',serve:'پستہ، بادام اور الائچی کے ساتھ ٹھنڈی یا نیم گرم پیش کریں۔',tips:['کھیر بہت گاڑھی ہو تو گرم دودھ تھوڑا تھوڑا شامل کریں۔','نیچے لگ جائے تو جلی تہہ نہ کھرچیں؛ اوپر والا حصہ دوسرے برتن میں منتقل کریں۔']},
