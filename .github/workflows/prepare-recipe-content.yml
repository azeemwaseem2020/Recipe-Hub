name: Prepare Recipe Content

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject recipe content and image renderer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changed = []
          targets = list(Path('recipes').glob('*.html')) + [Path('ur/recipe.html'), Path('index.html'), Path('ur/index.html')]
          for path in targets:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              changed_here = False
              if path.parent.name == 'recipes':
                  marker = '<script src="../recipe-content.js"></script>'
                  if marker not in text:
                      text = text.replace('</body>', marker + '</body>')
                      changed_here = True
              elif path.as_posix() == 'ur/recipe.html':
                  marker = '<script src="../recipe-content.js"></script>'
                  tips = '<script src="./recipe-tips.js"></script>'
                  if marker not in text:
                      text = text.replace('</body>', marker + '</body>')
                      changed_here = True
                  if tips not in text:
                      text = text.replace('</body>', tips + '</body>')
                      changed_here = True
              elif path.as_posix() == 'index.html':
                  marker = '<script src="recipe-images.js"></script>'
                  if marker not in text:
                      text = text.replace('</body>', marker + '</body>')
                      changed_here = True
              elif path.as_posix() == 'ur/index.html':
                  marker = '<script src="../recipe-images.js"></script>'
                  if marker not in text:
                      text = text.replace('</body>', marker + '</body>')
                      changed_here = True
              if changed_here:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))
          print('Injected:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit prepared pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recipes/*.html ur/recipe.html index.html ur/index.html
          if git diff --cached --quiet; then
            echo "No page changes required."
            exit 0
          fi
          git commit -m "Prepare recipe image loading across all pages"
          git push