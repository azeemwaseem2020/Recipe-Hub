name: Prepare Recipe Content

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject detailed content renderer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changed = []
          for path in sorted(Path('recipes').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              marker = '<script src="../recipe-content.js"></script>'
              if marker not in text:
                  text = text.replace('</body>', marker + '</body>')
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))
          ur = Path('ur/recipe.html')
          if ur.exists():
              text = ur.read_text(encoding='utf-8')
              marker = '<script src="../recipe-content.js"></script>'
              if marker not in text:
                  text = text.replace('</body>', marker + '</body>')
                  ur.write_text(text, encoding='utf-8')
                  changed.append(str(ur))
          print('Injected:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit prepared pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recipes/*.html ur/recipe.html
          if git diff --cached --quiet; then
            echo "No page changes required."
            exit 0
          fi
          git commit -m "Prepare detailed bilingual recipe pages"
          git push